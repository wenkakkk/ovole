<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Claude Code Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            claude: {
              bg: '#FAF9F5',
              sidebar: '#F4F3EE',
              card: '#FFFFFF',
              inputBg: '#F3F1EC',
              border: '#E8E6DF',
              hover: '#EAE8E1',
              text: '#2C2B28',
              muted: '#8A8780',
              accent: '#DA7756',
              accentHover: '#C66747',
              success: '#4E8C61'
            }
          }
        }
      }
    }
  </script>
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Claude%20Code%20Studio%22%2C%22short_name%22%3A%22CodeStudio%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FAF9F5%22%2C%22theme_color%22%3A%22%23FAF9F5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fi.postimg.cc%2FjjpfKpFf%2F1786631737260.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/jjpfKpFf/1786631737260.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FAF9F5">
  <style>
    .mobile-height { height: 100dvh; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    pre { white-space: pre-wrap; word-break: break-all; }
  </style>
  <style id="custom-user-css"></style>
</head>
<body class="bg-claude-bg text-claude-text mobile-height flex flex-col overflow-hidden font-sans select-none">

  <!-- 顶部导航栏 -->
  <header class="h-14 flex items-center justify-between px-3 bg-claude-bg/95 border-b border-claude-border flex-shrink-0 z-20">
    <div class="flex items-center space-x-2">
      <button onclick="toggleDrawer(true)" class="p-1.5 active:opacity-60 text-claude-text">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h10M4 18h16"></path>
        </svg>
      </button>
      <div class="leading-tight">
        <div id="current-title" class="text-sm font-semibold truncate max-w-[110px]">新聊天</div>
        <div id="header-repo-status" class="text-[10px] text-claude-muted truncate max-w-[110px]">未绑定仓库</div>
      </div>
    </div>

    <!-- 顶部右侧菜单按钮组 -->
    <div class="flex items-center space-x-1">
      <button onclick="toggleAutoPushSetting()" id="btn-autopush" class="px-2 py-1 rounded-full text-[10px] font-mono border border-claude-border flex items-center gap-1 active:bg-claude-hover">
        <span id="autopush-dot" class="w-1.5 h-1.5 rounded-full bg-claude-success"></span>
        <span id="autopush-label">自动推送: 开</span>
      </button>

      <!-- 删除当前对话按钮 -->
      <button onclick="deleteCurrentActiveConversation()" class="p-1.5 active:opacity-60 text-claude-muted hover:text-red-500" title="删除当前对话">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
      </button>

      <!-- 手工直接编辑与推送 -->
      <button onclick="openDirectEditor()" class="p-1.5 active:opacity-60 text-claude-accent" title="直接编写与推送">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- 抽屉遮罩 -->
  <div id="drawer-backdrop" onclick="toggleDrawer(false)" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-30 transition-opacity"></div>

  <!-- 侧滑抽屉 -->
  <aside id="drawer" class="fixed top-0 bottom-0 left-0 w-[86%] max-w-xs bg-claude-sidebar border-r border-claude-border z-40 transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="flex border-b border-claude-border">
      <button id="tab-conv" onclick="switchDrawerTab('conversations')" class="flex-1 py-3 text-xs font-semibold text-claude-accent border-b-2 border-claude-accent">历史会话</button>
      <button id="tab-git" onclick="switchDrawerTab('git')" class="flex-1 py-3 text-xs font-semibold text-claude-muted">折叠目录树</button>
    </div>

    <!-- 历史会话 -->
    <div id="panel-conversations" class="flex-1 overflow-y-auto p-3 space-y-2 no-scrollbar">
      <button onclick="createNewConversation()" class="w-full py-2 px-3 rounded-lg border border-claude-border bg-claude-card text-xs flex items-center justify-between text-claude-accent font-medium active:bg-claude-hover">
        <span>新聊天</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      </button>
      <div id="history-list" class="space-y-1 mt-2"></div>
    </div>

    <!-- 树状折叠文件夹 -->
    <div id="panel-git" class="flex-1 overflow-y-auto p-3 space-y-3 hidden no-scrollbar">
      <div class="flex items-center justify-between pb-1 border-b border-claude-border">
        <span class="text-[11px] font-medium text-claude-muted">项目目录</span>
        <button onclick="fetchAllRepoFiles()" class="text-xs text-claude-accent flex items-center gap-1 active:opacity-75">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          重新拉取
        </button>
      </div>

      <div id="batch-action-bar" class="hidden bg-claude-card border border-claude-border p-2 rounded-lg flex items-center justify-between shadow-2xs">
        <span class="text-[11px] text-claude-muted">已选 <span id="selected-files-count" class="text-claude-accent font-bold">0</span> 个文件</span>
        <button onclick="confirmBatchFilesToContext()" id="btn-batch-confirm" class="bg-claude-accent text-white px-2.5 py-1 rounded text-xs active:bg-claude-accentHover font-medium flex items-center gap-1">
          <span>批量载入</span>
        </button>
      </div>

      <div id="tree-container" class="space-y-0.5 text-xs">
        <p class="text-[11px] text-claude-muted py-6 text-center">请先设置并绑定 Git 仓库</p>
      </div>
    </div>

    <!-- 侧边栏底部设置按键 -->
    <div class="p-2 border-t border-claude-border bg-claude-sidebar">
      <button onclick="openFullSettingsPage()" class="w-full py-2 px-3 rounded-xl border border-claude-border bg-claude-card text-xs flex items-center justify-between text-claude-text font-medium active:bg-claude-hover">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-claude-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span>系统设置中心</span>
        </div>
        <svg class="w-3.5 h-3.5 text-claude-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </aside>

  <!-- 聊天主视口 -->
  <main id="chat-viewport" class="flex-1 overflow-y-auto px-4 py-3 space-y-4 no-scrollbar">
    <div id="chat-stream" class="space-y-4 pb-2"></div>
  </main>

  <!-- 底部输入卡片 -->
  <footer class="p-3 bg-claude-bg/95 flex-shrink-0 z-10 border-t border-claude-border/50">
    <div class="bg-claude-inputBg rounded-3xl p-3 transition-all">
      
      <!-- 附件预览区 -->
      <div id="attachment-container" class="hidden mb-2 flex-wrap gap-1.5 items-center max-h-24 overflow-y-auto no-scrollbar">
        <div id="file-chips" class="flex flex-wrap gap-1.5"></div>
        <div id="image-preview" class="hidden relative">
          <img id="preview-img" class="w-10 h-10 object-cover rounded-lg border border-claude-border">
          <button onclick="clearSelectedImage()" class="absolute -top-1 -right-1 bg-black/60 text-white rounded-full p-0.5">
            <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>

      <!-- 输入框 -->
      <textarea id="user-input" rows="1" oninput="updateRealtimeTokenEstimator()" placeholder="输入聊天内容或代码修改需求..."
        class="w-full bg-transparent resize-none focus:outline-none text-[15px] placeholder-claude-muted text-claude-text leading-relaxed select-text"></textarea>

      <!-- 卡片底部工具栏 -->
      <div class="flex items-center justify-between mt-2 pt-1">
        <button onclick="openModal('model-picker-modal')" class="flex items-center space-x-1 px-2.5 py-1 rounded-full bg-claude-card border border-claude-border text-xs active:bg-claude-hover">
          <svg class="w-3.5 h-3.5 text-claude-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
          </svg>
          <span id="label-active-model" class="font-mono text-claude-text truncate max-w-[95px]">选择模型</span>
          <svg class="w-3 h-3 text-claude-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>

        <div class="flex items-center space-x-2">
          <!-- 实时 Token 显示 -->
          <div class="text-[11px] font-mono text-claude-muted bg-claude-card/80 px-2 py-0.5 rounded border border-claude-border/80 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-claude-accent inline-block"></span>
            <span id="footer-token-count">0 tok</span>
          </div>

          <!-- 加号识图 -->
          <input type="file" id="image-file-input" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
          <button onclick="document.getElementById('image-file-input').click()" class="p-1 rounded-full text-claude-text active:bg-claude-hover">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
          
          <!-- 发送按钮 -->
          <button id="send-btn" onclick="sendMessage()" class="w-8 h-8 rounded-full bg-claude-accent text-white flex items-center justify-center active:bg-claude-accentHover">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- ================= 页面：全屏系统设置中心 ================= -->
  <div id="full-settings-page" class="fixed inset-0 bg-claude-bg hidden flex flex-col z-50 overflow-hidden">
    <div class="h-14 border-b border-claude-border flex items-center justify-between px-4 bg-claude-sidebar flex-shrink-0">
      <div class="flex items-center space-x-2">
        <button onclick="closeFullSettingsPage()" class="p-1 text-claude-muted active:opacity-60">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <span class="font-semibold text-sm">系统设置中心</span>
      </div>
      <button onclick="saveAllSettingsFromPage()" class="px-3 py-1.5 rounded-lg bg-claude-accent text-white text-xs font-medium active:bg-claude-accentHover">
        保存并返回
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-5 no-scrollbar pb-10">
      <!-- PWA 安装到桌面卡片 -->
      <div class="bg-claude-card border border-claude-border rounded-2xl p-3.5 space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <img src="https://i.postimg.cc/jjpfKpFf/1786631737260.png" class="w-7 h-7 rounded-lg border border-claude-border">
            <span class="font-medium text-xs">PWA 桌面应用</span>
          </div>
          <button onclick="triggerPwaInstall()" id="btn-pwa-install" class="px-3 py-1 bg-claude-accent text-white rounded-lg text-xs font-medium active:bg-claude-accentHover">
            安装到手机桌面
          </button>
        </div>
        <p class="text-[11px] text-claude-muted leading-relaxed">安装后可像原生 App 一样直接从桌面全屏启动运行，无需进入浏览器地址栏。</p>
      </div>

      <!-- AI 接口与预设管理 -->
      <div class="bg-claude-card border border-claude-border rounded-2xl p-3.5 space-y-3">
        <span class="font-semibold text-xs text-claude-text block border-b border-claude-border pb-1.5">AI 接口与多预设管理</span>
        <div class="bg-claude-sidebar p-2 rounded-xl border border-claude-border space-y-2">
          <div class="flex items-center justify-between">
            <span class="font-medium text-[11px] text-claude-text">当前选定方案</span>
            <button onclick="deleteCurrentPreset()" class="text-red-500 active:underline text-[10px]">删除此方案</button>
          </div>
          <div class="flex gap-1.5">
            <select id="preset-selector" onchange="onPresetSelected()" class="flex-1 bg-claude-card border border-claude-border rounded-lg p-1.5 text-xs focus:outline-none">
            </select>
            <button onclick="saveAsNewPreset()" class="px-2.5 py-1.5 bg-claude-accent text-white rounded-lg font-medium active:bg-claude-accentHover text-xs flex-shrink-0">
              另存为新方案
            </button>
          </div>
        </div>

        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-claude-muted mb-1 font-medium">方案名称</label>
            <input type="text" id="ai-preset-name" placeholder="例如: 官方Gemini / 中转站1" class="w-full bg-claude-bg border border-claude-border rounded-lg p-2 focus:outline-none select-text">
          </div>
          <div>
            <label class="block text-claude-muted mb-1 font-medium">API Base URL</label>
            <input type="text" id="ai-base-input" placeholder="https://api.openai.com/v1" class="w-full bg-claude-bg border border-claude-border rounded-lg p-2 focus:outline-none select-text">
          </div>
          <div>
            <label class="block text-claude-muted mb-1 font-medium">API Key</label>
            <input type="password" id="ai-key-input" placeholder="sk-xxxxxxxxxxxx" class="w-full bg-claude-bg border border-claude-border rounded-lg p-2 focus:outline-none select-text">
          </div>
          <div>
            <button onclick="pullModelsFromApi()" class="w-full py-1.5 bg-claude-bg border border-claude-border rounded-lg text-claude-accent font-medium active:bg-claude-hover flex items-center justify-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              从该 API 自动拉取模型列表
            </button>
            <p id="model-pull-msg" class="text-[10px] text-claude-muted mt-1 truncate">未拉取</p>
          </div>
        </div>
      </div>

      <!-- 自定义机器人 System Prompt -->
      <div class="bg-claude-card border border-claude-border rounded-2xl p-3.5 space-y-2 text-xs">
        <span class="font-semibold text-xs text-claude-text block border-b border-claude-border pb-1.5">自定义机器人提示词 (System Prompt)</span>
        <textarea id="cfg-custom-prompt" rows="3" placeholder="在此输入自定义系统提示词，留空则使用内置的高级工程师提示词..." class="w-full bg-claude-bg border border-claude-border rounded-xl p-2.5 text-xs font-mono select-text focus:outline-none leading-relaxed"></textarea>
      </div>

      <!-- GitHub 合作仓库配置 -->
      <div class="bg-claude-card border border-claude-border rounded-2xl p-3.5 space-y-2.5 text-xs">
        <span class="font-semibold text-xs text-claude-text block border-b border-claude-border pb-1.5">GitHub 仓库与合作者设置</span>
        <div>
          <label class="block text-claude-muted mb-1 font-medium">Personal Access Token (需 repo 读写权限)</label>
          <input type="password" id="git-token-input" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-claude-bg border border-claude-border rounded-lg p-2 focus:outline-none select-text">
        </div>
        <div>
          <label class="block text-claude-muted mb-1 font-medium">合作仓库全称 (拥有者/仓库名)</label>
          <input type="text" id="git-custom-repo" placeholder="例如: team/private-project" class="w-full bg-claude-bg border border-claude-border rounded-lg p-2 focus:outline-none select-text">
        </div>
        <div>
          <label class="block text-claude-muted mb-1 font-medium">分支 (Branch)</label>
          <input type="text" id="git-branch" placeholder="main" value="main" class="w-full bg-claude-bg border border-claude-border rounded-lg p-2 focus:outline-none select-text">
        </div>
        <div>
          <button onclick="loadCollaboratorRepos()" class="w-full py-1.5 border border-claude-border bg-claude-bg rounded-lg text-claude-accent font-medium active:bg-claude-hover">
            拉取我加入的合作与私密仓库
          </button>
          <select id="git-repo-dropdown" onchange="applyDropdownRepo()" class="mt-1.5 w-full bg-claude-bg border border-claude-border rounded-lg p-1.5 text-xs focus:outline-none hidden">
          </select>
        </div>
      </div>

      <!-- 自定义全局美化 CSS -->
      <div class="bg-claude-card border border-claude-border rounded-2xl p-3.5 space-y-2 text-xs">
        <span class="font-semibold text-xs text-claude-text block border-b border-claude-border pb-1.5">自定义界面美化 CSS</span>
        <textarea id="cfg-custom-css" rows="3" placeholder="在此输入自定义 CSS 代码，保存后即时注入渲染..." class="w-full bg-claude-bg border border-claude-border rounded-xl p-2.5 text-xs font-mono select-text focus:outline-none leading-relaxed"></textarea>
      </div>

      <!-- 数据导出备份与导入恢复 -->
      <div class="bg-claude-card border border-claude-border rounded-2xl p-3.5 space-y-2.5 text-xs">
        <span class="font-semibold text-xs text-claude-text block border-b border-claude-border pb-1.5">完整数据备份与恢复</span>
        <button onclick="exportAllDataToJSON()" class="w-full py-2 bg-claude-accent text-white rounded-lg font-medium flex items-center justify-center gap-1 active:bg-claude-accentHover">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          一键导出完整备份数据 (JSON)
        </button>
        <div>
          <input type="file" id="import-file-input" accept=".json" class="hidden" onchange="importDataFromJSON(event)">

  <!-- JavaScript 核心驱动 -->
  <script>
    /* ================= 1. IndexedDB 驱动 ================= */
    class StorageEngine {
      constructor() {
        this.dbName = 'ClaudeStudioFolderTreeDB';
        this.version = 3;
        this.db = null;
      }
      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.version);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('conversations')) d.createObjectStore('conversations', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
          };
          req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
          req.onerror = (e) => reject(e);
        });
      }
      async set(store, val) {
        return new Promise((res) => {
          const tx = this.db.transaction(store, 'readwrite');
          tx.objectStore(store).put(val);
          tx.oncomplete = () => res(true);
        });
      }
      async get(store, key) {
        return new Promise((res) => {
          const tx = this.db.transaction(store, 'readonly');
          const req = tx.objectStore(store).get(key);
          req.onsuccess = () => res(req.result);
          req.onerror = () => res(null);
        });
      }
      async getAll(store) {
        return new Promise((res) => {
          const tx = this.db.transaction(store, 'readonly');
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => res(req.result || []);
        });
      }
      async del(store, key) {
        return new Promise((res) => {
          const tx = this.db.transaction(store, 'readwrite');
          tx.objectStore(store).delete(key);
          tx.oncomplete = () => res(true);
        });
      }
      async clear(store) {
        return new Promise((res) => {
          const tx = this.db.transaction(store, 'readwrite');
          tx.objectStore(store).clear();
          tx.oncomplete = () => res(true);
        });
      }
    }

    const storage = new StorageEngine();

    /* ================= 2. 全局状态与预设系统 ================= */
    let deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPwaPrompt = e;
    });

    const state = {
      git: { token: '', repo: '', branch: 'main' },
      aiPresets: [
        {
          id: 'preset_default',
          name: '默认方案',
          baseUrl: 'https://api.openai.com/v1',
          apiKey: '',
          model: 'gemini-3.8-flash',
          availableModels: []
        }
      ],
      currentPresetId: 'preset_default',
      streamOutput: true,
      customPrompt: '',
      customCss: '',
      autoPush: true,
      currentConversationId: null,
      messages: [],
      loadedFilesMap: {},
      selectedPaths: new Set(),
      selectedImageBase64: null,
      totalSessionTokens: 0
    };

    function getCurrentPreset() {
      return state.aiPresets.find(p => p.id === state.currentPresetId) || state.aiPresets[0];
    }

    window.onload = async () => {
      await storage.init();

      const savedGit = await storage.get('settings', 'git_config');
      if (savedGit) state.git = { ...state.git, ...savedGit.val };

      const savedPresets = await storage.get('settings', 'ai_presets');
      if (savedPresets && savedPresets.val && savedPresets.val.length > 0) {
        state.aiPresets = savedPresets.val;
      }

      const savedCurrentPresetId = await storage.get('settings', 'current_preset_id');
      if (savedCurrentPresetId && savedCurrentPresetId.val) {
        state.currentPresetId = savedCurrentPresetId.val;
      }

      const savedStream = await storage.get('settings', 'stream_setting');
      if (savedStream !== null && savedStream !== undefined) state.streamOutput = savedStream.val;
      document.getElementById('stream-toggle').checked = state.streamOutput;

      const savedPrompt = await storage.get('settings', 'custom_prompt');
      if (savedPrompt) state.customPrompt = savedPrompt.val || '';
      document.getElementById('cfg-custom-prompt').value = state.customPrompt;

      const savedCss = await storage.get('settings', 'custom_css');
      if (savedCss) {
        state.customCss = savedCss.val || '';
        document.getElementById('cfg-custom-css').value = state.customCss;
        applyCustomCss(state.customCss);
      }

      const savedTokens = await storage.get('settings', 'total_tokens');
      if (savedTokens) {
        state.totalSessionTokens = savedTokens.val || 0;
        document.getElementById('footer-token-count').innerText = `${state.totalSessionTokens} tok`;
      }

      const savedAutoPush = await storage.get('settings', 'autopush_setting');
      if (savedAutoPush !== null && savedAutoPush !== undefined) state.autoPush = savedAutoPush.val;
      updateAutoPushUI();

      document.getElementById('git-token-input').value = state.git.token;
      document.getElementById('git-custom-repo').value = state.git.repo;
      document.getElementById('git-branch').value = state.git.branch;

      renderPresetOptions();
      syncPresetFormUI();
      updateStatusHeader();
      updateModelDisplay();

      const convs = await storage.getAll('conversations');
      if (convs.length > 0) {
        convs.sort((a,b) => b.updatedAt - a.updatedAt);
        await loadConversation(convs[0].id);
      } else {
        await createNewConversation();
      }

      renderHistoryList();
    };

    function applyCustomCss(css) {
      document.getElementById('custom-user-css').textContent = css || '';
    }

    function openFullSettingsPage() {
      toggleDrawer(false);
      document.getElementById('full-settings-page').classList.remove('hidden');
    }

    function closeFullSettingsPage() {
      document.getElementById('full-settings-page').classList.add('hidden');
    }

    async function saveAllSettingsFromPage() {
      const cur = getCurrentPreset();
      cur.name = document.getElementById('ai-preset-name').value.trim() || '未命名预设';
      cur.baseUrl = document.getElementById('ai-base-input').value.trim().replace(/\/+$/, "");
      cur.apiKey = document.getElementById('ai-key-input').value.trim();

      state.git.token = document.getElementById('git-token-input').value.trim();
      state.git.repo = document.getElementById('git-custom-repo').value.trim();
      state.git.branch = document.getElementById('git-branch').value.trim() || 'main';

      state.customPrompt = document.getElementById('cfg-custom-prompt').value.trim();
      state.customCss = document.getElementById('cfg-custom-css').value;
      applyCustomCss(state.customCss);

      await storage.set('settings', { key: 'git_config', val: state.git });
      await storage.set('settings', { key: 'ai_presets', val: state.aiPresets });
      await storage.set('settings', { key: 'custom_prompt', val: state.customPrompt });
      await storage.set('settings', { key: 'custom_css', val: state.customCss });

      updateStatusHeader();
      updateModelDisplay();
      closeFullSettingsPage();
    }

    function onStreamToggleChange() {
      state.streamOutput = document.getElementById('stream-toggle').checked;
      storage.set('settings', { key: 'stream_setting', val: state.streamOutput });
    }

    async function deleteCurrentActiveConversation() {
      if (!state.currentConversationId) return;
      if (!confirm('确定删除当前这个会话的所有聊天记录吗？')) return;
      await storage.del('conversations', state.currentConversationId);
      const allConvs = await storage.getAll('conversations');
      if (allConvs.length > 0) {
        allConvs.sort((a,b) => b.updatedAt - a.updatedAt);
        await loadConversation(allConvs[0].id);
      } else {
        await createNewConversation();
      }
      renderHistoryList();
    }

    function triggerPwaInstall() {
      if (deferredPwaPrompt) {
        deferredPwaPrompt.prompt();
        deferredPwaPrompt.userChoice.then(() => { deferredPwaPrompt = null; });
      } else {
        alert('若当前浏览器未弹出安装提示，请点击浏览器自带的菜单，选择“添加到主屏幕”即可安装为桌面图标。');
      }
    }

    function updateStatusHeader() {
      document.getElementById('header-repo-status').innerText = state.git.repo || '未绑定仓库';
    }

    function updateModelDisplay() {
      const cur = getCurrentPreset();
      document.getElementById('label-active-model').innerText = cur.model || '选择模型';
    }

    function toggleAutoPushSetting() {
      state.autoPush = !state.autoPush;
      storage.set('settings', { key: 'autopush_setting', val: state.autoPush });
      updateAutoPushUI();
    }

    function updateAutoPushUI() {
      const dot = document.getElementById('autopush-dot');
      const text = document.getElementById('autopush-label');
      if (state.autoPush) {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-claude-success';
        text.innerText = '自动推送: 开';
      } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-claude-muted';
        text.innerText = '自动推送: 关';
      }
    }

    function updateRealtimeTokenEstimator() {
      const text = document.getElementById('user-input').value;
      const estimatedInputTok = Math.round(text.length / 3.2);
      document.getElementById('footer-token-count').innerText = `${state.totalSessionTokens + estimatedInputTok} tok`;
    }

    /* ================= 3. API 预设系统逻辑 ================= */
    function renderPresetOptions() {
      const sel = document.getElementById('preset-selector');
      sel.innerHTML = '';
      state.aiPresets.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = p.name;
        if (p.id === state.currentPresetId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function syncPresetFormUI() {
      const cur = getCurrentPreset();
      document.getElementById('ai-preset-name').value = cur.name;
      document.getElementById('ai-base-input').value = cur.baseUrl;
      document.getElementById('ai-key-input').value = cur.apiKey;
      document.getElementById('model-pull-msg').innerText = cur.availableModels?.length ? `已拉取 ${cur.availableModels.length} 个模型` : '未拉取';
    }

    async function onPresetSelected() {
      const selId = document.getElementById('preset-selector').value;
      state.currentPresetId = selId;
      await storage.set('settings', { key: 'current_preset_id', val: selId });
      syncPresetFormUI();
      updateModelDisplay();
    }

    async function saveCurrentPreset() {
      const cur = getCurrentPreset();
      cur.name = document.getElementById('ai-preset-name').value.trim() || '未命名预设';
      cur.baseUrl = document.getElementById('ai-base-input').value.trim().replace(/\/+$/, "");
      cur.apiKey = document.getElementById('ai-key-input').value.trim();

      await storage.set('settings', { key: 'ai_presets', val: state.aiPresets });
      renderPresetOptions();
      updateModelDisplay();
      closeModal('ai-modal');
    }

    async function saveAsNewPreset() {
      const name = prompt('请输入新预设的名称:', '新配置方案');
      if (!name) return;
      const newPreset = {
        id: 'preset_' + Date.now(),
        name: name,
        baseUrl: document.getElementById('ai-base-input').value.trim().replace(/\/+$/, ""),
        apiKey: document.getElementById('ai-key-input').value.trim(),
        model: 'gemini-3.8-flash',
        availableModels: []
      };
      state.aiPresets.push(newPreset);
      state.currentPresetId = newPreset.id;
      await storage.set('settings', { key: 'ai_presets', val: state.aiPresets });
      await storage.set('settings', { key: 'current_preset_id', val: state.currentPresetId });
      renderPresetOptions();
      syncPresetFormUI();
      updateModelDisplay();
    }

    async function deleteCurrentPreset() {
      if (state.aiPresets.length <= 1) return alert('请至少保留一个配置预设');
      if (!confirm('确定删除当前选中的预设吗？')) return;
      state.aiPresets = state.aiPresets.filter(p => p.id !== state.currentPresetId);
      state.currentPresetId = state.aiPresets[0].id;
      await storage.set('settings', { key: 'ai_presets', val: state.aiPresets });
      await storage.set('settings', { key: 'current_preset_id', val: state.currentPresetId });
      renderPresetOptions();
      syncPresetFormUI();
      updateModelDisplay();
    }

    /* ================= 4. 高性能折叠目录树与批量载入 ================= */
    function buildDirectoryTree(paths) {
      const root = { name: '', isDir: true, children: {}, path: '' };
      paths.forEach(p => {
        const parts = p.split('/');
        let curr = root;
        let currPath = '';
        for (let i = 0; i < parts.length; i++) {
          const part = parts[i];
          currPath = currPath ? `${currPath}/${part}` : part;
          const isFile = (i === parts.length - 1);
          if (!curr.children[part]) {
            curr.children[part] = {
              name: part,
              path: currPath,
              isDir: !isFile,
              children: isFile ? null : {}
            };
          }
          curr = curr.children[part];
        }
      });
      return root;
    }

    // 文档碎片渲染，杜绝手机端卡顿
    function renderTreeNode(node, depth = 0) {
      const fragment = document.createDocumentFragment();

      const sortedKeys = Object.keys(node.children || {}).sort((a, b) => {
        const nA = node.children[a];
        const nB = node.children[b];
        if (nA.isDir && !nB.isDir) return -1;
        if (!nA.isDir && nB.isDir) return 1;
        return a.localeCompare(b);
      });

      sortedKeys.forEach(key => {
        const child = node.children[key];
        const itemWrap = document.createElement('div');
        itemWrap.className = 'flex flex-col';

        const row = document.createElement('div');
        row.className = `flex items-center justify-between py-1.5 px-2 rounded hover:bg-claude-hover active:bg-claude-hover text-xs select-none transition-colors`;
        row.style.paddingLeft = `${depth * 12 + 6}px`;

        if (child.isDir) {
          row.innerHTML = `
            <div class="flex items-center gap-1.5 truncate cursor-pointer flex-1">
              <svg class="w-3.5 h-3.5 text-claude-muted flex-shrink-0 transition-transform folder-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
              <svg class="w-4 h-4 text-claude-accent flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
              </svg>
              <span class="truncate font-medium text-claude-text">${child.name}</span>
            </div>
          `;

          let subTree = null;
          let isRendered = false;

          row.onclick = () => {
            if (!isRendered) {
              subTree = document.createElement('div');
              subTree.appendChild(renderTreeNode(child, depth + 1));
              itemWrap.appendChild(subTree);
              isRendered = true;
            }
            const isHidden = subTree.classList.toggle('hidden');
            const arrow = row.querySelector('.folder-arrow');
            arrow.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(90deg)';
          };

          itemWrap.appendChild(row);
        } else {
          const isChecked = state.selectedPaths.has(child.path);
          row.innerHTML = `
            <div class="flex items-center gap-1.5 truncate flex-1 cursor-pointer">
              <input type="checkbox" ${isChecked ? 'checked' : ''} class="w-3.5 h-3.5 rounded border-claude-border text-claude-accent focus:ring-0 file-checkbox flex-shrink-0">
              <svg class="w-4 h-4 text-claude-muted flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
              <span class="truncate font-mono text-[11px] text-claude-text">${child.name}</span>
            </div>
          `;

          const chk = row.querySelector('.file-checkbox');
          const toggleSelection = (e) => {
            if (e) e.stopPropagation();
            if (state.selectedPaths.has(child.path)) {
              state.selectedPaths.delete(child.path);
              chk.checked = false;
            } else {
              state.selectedPaths.add(child.path);
              chk.checked = true;
            }
            updateBatchActionBar();
          };

          chk.onclick = toggleSelection;

    /* ================= 5. 精准补丁算法 (健壮防卡死容错版) ================= */
    function applyPatch(originalContent, searchBlock, replaceBlock) {
      if (!originalContent) return null;
      // 1. 完全相同全匹配
      if (originalContent.includes(searchBlock)) {
        return originalContent.replace(searchBlock, replaceBlock);
      }
      
      // 2. 换行与空白字符归一化匹配
      const cleanCRLF = (str) => str.replace(/\r\n/g, '\n');
      const normOrig = cleanCRLF(originalContent);
      const normSearch = cleanCRLF(searchBlock).trim();

      if (normOrig.includes(normSearch)) {
        return normOrig.replace(normSearch, replaceBlock);
      }

      // 3. 逐行忽略首尾空白匹配
      const linesOrig = normOrig.split('\n');
      const linesSearch = normSearch.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      if (linesSearch.length === 0) return null;

      for (let i = 0; i <= linesOrig.length - linesSearch.length; i++) {
        let match = true;
        for (let j = 0; j < linesSearch.length; j++) {
          if (linesOrig[i + j].trim() !== linesSearch[j]) {
            match = false;
            break;
          }
        }
        if (match) {
          linesOrig.splice(i, linesSearch.length, replaceBlock);
          return linesOrig.join('\n');
        }
      }

      return null;
    }

    /* ================= 6. 发送与通信主逻辑 (流式输出 + 全面深度捕获真实思维链) ================= */
    async function sendMessage(isRegenerate = false, editIndex = null) {
      const curPreset = getCurrentPreset();
      const input = document.getElementById('user-input');
      let text = input.value.trim();
      let selectedPaths = Array.from(state.selectedPaths);

      if (editIndex !== null) {
        state.messages = state.messages.slice(0, editIndex);
      } else if (isRegenerate) {
        if (state.messages.length > 0 && state.messages[state.messages.length - 1].role === 'assistant') {
          state.messages.pop();
        }
        const lastUser = state.messages[state.messages.length - 1];
        if (lastUser) {
          text = lastUser.displayObj.text;
          selectedPaths = lastUser.displayObj.attachedFiles.map(f => f.path);
        }
      }

      if (!text && !state.selectedImageBase64 && selectedPaths.length === 0) return;
      if (!curPreset.apiKey) return openFullSettingsPage();

      let apiPrompt = text || '请处理附带内容。';
      if (selectedPaths.length > 0) {
        let bundleContext = `\n\n【关联文件参考内容】：\n`;
        selectedPaths.forEach(p => {
          const fileData = state.loadedFilesMap[p];
          if (fileData && fileData.content) {
            bundleContext += `<<<FILE_CONTENT path="${p}">>>\n${fileData.content}\n<<<END_FILE_CONTENT>>>\n\n`;
          }
        });
        apiPrompt += bundleContext;
      }

      let userApiContent = apiPrompt;
      if (state.selectedImageBase64) {
        userApiContent = [
          { type: 'text', text: apiPrompt },
          { type: 'image_url', image_url: { url: state.selectedImageBase64 } }
        ];
      }

      const userDisplayObj = {
        text: text,
        attachedFiles: selectedPaths.map(p => ({
          path: p,
          lines: state.loadedFilesMap[p]?.content ? state.loadedFilesMap[p].content.split('\n').length : 0
        })),
        imageUrl: state.selectedImageBase64
      };

      const nowTime = getFormattedTime();

      if (!isRegenerate) {
        renderUserMessageDOM(userDisplayObj, nowTime, state.messages.length);
        state.messages.push({
          role: 'user',
          apiContent: userApiContent,
          displayObj: userDisplayObj,
          time: nowTime
        });
      }

      input.value = '';
      clearSelectedImage();
      state.selectedPaths.clear();
      renderSelectedFileChips();
      updateBatchActionBar();

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      const startTime = Date.now();
      const loadingNode = renderAssistantMessageDOM({
        cleanText: '思考推理中...',
        reasoning: '',
        thinkingTime: null,
        usage: null,
        timeStr: getFormattedTime(),
        patches: [],
        isLoading: true
      });

      try {
        const baseDefaultPrompt = `你是一个顶级智能助手，精通全栈工程开发，也擅长解答各类日常问题与进行自由深度交谈。
【行为规范】：
1. 正常闲聊、解答疑问、技术咨询时：用清晰生动的方式直接回答，畅所欲言。
2. 涉及代码修改诉求时：只输出局部修改，严禁输出完整大文件！必须严格按照以下格式输出局部替换块：
<<<PATCH path="目标文件相对路径">>>
<<<<<<< SEARCH
原文件中需要被替换的一小段精确代码
=======
修改后的新代码
>>>>>>> REPLACE
<<<END_PATCH>>>`;

        const finalSystemPrompt = state.customPrompt || baseDefaultPrompt;

        const messagesToSend = [
          { role: 'system', content: finalSystemPrompt },
          ...state.messages.map(m => ({
            role: m.role,
            content: m.role === 'user' ? m.apiContent : m.content
          }))
        ];

        let content = '';
        let reasoning = '';
        let promptTokens = Math.max(1, Math.round(JSON.stringify(messagesToSend).length / 3.6));

        if (state.streamOutput) {
          // ================= 流式输出处理 =================
          const response = await fetch(`${curPreset.baseUrl}/chat/completions`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${curPreset.apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: curPreset.model,
              messages: messagesToSend,
              stream: true
            })
          });

          if (!response.ok) throw new Error((await response.json()).error?.message || '流式请求失败');

          loadingNode.remove();
          const activeDom = renderAssistantMessageDOM({
            cleanText: '',
            reasoning: '',
            thinkingTime: null,
            usage: null,
            timeStr: getFormattedTime(),
            patches: [],
            isLoading: false,
            msgIndex: state.messages.length
          });

          const textEl = activeDom.querySelector('.assistant-clean-text');
          const detailsEl = activeDom.querySelector('details');
          const reasoningEl = activeDom.querySelector('.assistant-reasoning-text');

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('data:')) continue;
              if (trimmed === 'data: [DONE]') continue;
              try {
                const json = JSON.parse(trimmed.replace(/^data:\s*/, ''));
                const delta = json.choices?.[0]?.delta;
                if (!delta) continue;

                // 捕获 reasoning / reasoning_content / thought
                const rChunk = delta.reasoning_content || delta.reasoning || delta.thought || '';
                if (rChunk) {
                  reasoning += rChunk;
                  if (detailsEl) detailsEl.classList.remove('hidden');
                  if (reasoningEl) reasoningEl.textContent = reasoning;
                }

                // 捕获正文 content
                const cChunk = delta.content || '';
                if (cChunk) {
                  content += cChunk;
                  // 处理嵌入标签式思考 ...
                  const thinkRegex = /<(?:think|thought|thinking)>([\s\S]*?)(?:<\/(?:think|thought|thinking)>|$)/i;
                  const tMatch = content.match(thinkRegex);
                  if (tMatch) {
                    reasoning = tMatch[1].trim();
                    if (detailsEl) detailsEl.classList.remove('hidden');
                    if (reasoningEl) reasoningEl.textContent = reasoning;
                  }

                  let liveClean = content.replace(/<(?:think|thought|thinking)>[\s\S]*?<\/(?:think|thought|thinking)>/gi, '')
                                         .replace(/<(?:think|thought|thinking)>[\s\S]*$/gi, '')
                                         .replace(/<<<PATCH[\s\S]*?<<<END_PATCH>>>/g, '')
                                         .replace(/<<<PATCH[\s\S]*$/g, '')
                                         .trim();
                  if (textEl) textEl.textContent = liveClean;
                }

                const vp = document.getElementById('chat-viewport');
                vp.scrollTop = vp.scrollHeight;
              } catch (e) {}
            }
          }
          activeDom.remove();
        } else {
          // ================= 非流式输出处理 =================
          const response = await fetch(`${curPreset.baseUrl}/chat/completions`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${curPreset.apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: curPreset.model,
              messages: messagesToSend
            })
          });

          if (!response.ok) throw new Error((await response.json()).error?.message || '请求失败');
          const data = await response.json();
          const choice = data.choices[0].message;
          content = choice.content || '';
          reasoning = choice.reasoning_content || choice.reasoning || choice.thought || '';
          loadingNode.remove();
        }

        const thinkingTimeSec = ((Date.now() - startTime) / 1000).toFixed(1);

        // 正则提取清洗残留的思维标签
        const tagRegex = /<(?:think|thought|thinking)>([\s\S]*?)<\/(?:think|thought|thinking)>/i;
        const thinkMatch = content.match(tagRegex);
        if (thinkMatch) {
          if (!reasoning) reasoning = thinkMatch[1].trim();
          content = content.replace(tagRegex, '').trim();
        }

        let completionTokens = Math.max(1, Math.round(content.length / 3.6));
        let totalTokens = promptTokens + completionTokens;

        const usage = {
          prompt_tokens: promptTokens,
          completion_tokens: completionTokens,
          total_tokens: totalTokens
        };

        state.totalSessionTokens += usage.total_tokens;
        document.getElementById('footer-token-count').innerText = `${state.totalSessionTokens} tok`;
        storage.set('settings', { key: 'total_tokens', val: state.totalSessionTokens });

        const respTime = getFormattedTime();

        // 提取精准局部修改补丁
        const patchRegex = /<<<PATCH path="([^"]+)">>>[\s\S]*?<<<<<<< SEARCH([\s\S]*?)=======([\s\S]*?)>>>>>>> REPLACE[\s\S]*?<<<END_PATCH>>>/g;
        const patches = [];
        let pMatch;
        while ((pMatch = patchRegex.exec(content)) !== null) {
          patches.push({
            path: pMatch[1].trim(),
            search: pMatch[2].replace(/^\n/, '').replace(/\n$/, ''),
            replace: pMatch[3].replace(/^\n/, '').replace(/\n$/, '')
          });
        }

        let cleanText = content.replace(/<<<PATCH path="[^"]+">>>[\s\S]*?<<<END_PATCH>>>/g, '')
                               .replace(/<<<PATCH[\s\S]*?<<<END_PATCH>>>/g, '')
                               .trim();

        renderAssistantMessageDOM({
          cleanText: cleanText,
          reasoning: reasoning,
          thinkingTime: thinkingTimeSec,
          usage: usage,
          timeStr: respTime,
          patches: patches,
          isLoading: false,
          msgIndex: state.messages.length
        });

        state.messages.push({
          role: 'assistant',
          content: content,
          cleanText: cleanText,
          reasoning: reasoning,
          thinkingTime: thinkingTimeSec,
          usage: usage,
          time: respTime,
          patches: patches
        });

        // 执行自动推送
        if (state.autoPush && patches.length > 0 && state.git.token && state.git.repo) {
          executePatchPushPipeline(patches);
        }

        await saveCurrentConversation();

      } catch (err) {
        loadingNode.innerHTML = `<div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs">错误: ${err.message}</div>`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    /* ================= 7. 执行局部修改与推送流水线 (关闭悬停卡死) ================= */
    async function executePatchPushPipeline(patches) {
      const banner = document.createElement('div');
      banner.className = 'w-full my-2 bg-claude-sidebar border border-claude-border rounded-xl p-3 text-xs space-y-1.5 transition-all';
      banner.innerHTML = `
        <div id="autopush-status-title" class="font-medium text-claude-accent flex items-center gap-1.5">
          <svg class="w-4 h-4 animate-spin flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          正在执行局部替换并推送到 GitHub...
        </div>
        <div id="patch-log" class="text-[11px] text-claude-muted space-y-1"></div>
      `;

      document.getElementById('chat-stream').appendChild(banner);
      const logDiv = banner.querySelector('#patch-log');
      const titleDiv = banner.querySelector('#autopush-status-title');

      const filePatches = {};
      patches.forEach(p => {
        if (!filePatches[p.path]) filePatches[p.path] = [];
        filePatches[p.path].push(p);
      });

      try {
        for (const filePath of Object.keys(filePatches)) {
          try {
            let fileObj = state.loadedFilesMap[filePath];
            if (!fileObj || !fileObj.content) {
              const checkRes = await fetch(`https://api.github.com/repos/${state.git.repo}/contents/${filePath}?ref=${state.git.branch}`, {
                headers: { 'Authorization': `Bearer ${state.git.token}` }
              });
              if (!checkRes.ok) throw new Error('拉取最新文件失败');
              const fileData = await checkRes.json();
              fileObj = {
                path: filePath,
                sha: fileData.sha,
                content: decodeURIComponent(escape(atob(fileData.content)))
              };
              state.loadedFilesMap[filePath] = fileObj;
            }

            let updatedContent = fileObj.content;
            const currentFilePatches = filePatches[filePath];

            for (const patch of currentFilePatches) {
              const patched = applyPatch(updatedContent, patch.search, patch.replace);
              if (patched === null) {
                throw new Error(`局部片段未在原文件中找到匹配`);
              }
              updatedContent = patched;
            }

            const base64Content = btoa(unescape(encodeURIComponent(updatedContent)));
            const putRes = await fetch(`https://api.github.com/repos/${state.git.repo}/contents/${filePath}`, {
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${state.git.token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: `Patch update ${filePath} via mobile AI`,
                content: base64Content,
                sha: fileObj.sha,
                branch: state.git.branch
              })
            });

            if (!putRes.ok) throw new Error('推送失败');
            const putData = await putRes.json();
            state.loadedFilesMap[filePath] = { path: filePath, sha: putData.content.sha, content: updatedContent };

            logDiv.innerHTML += `
              <div class="text-claude-success flex items-center gap-1 font-mono">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                已精准打补丁并推送: ${filePath} (Commit: ${putData.commit.sha.substring(0,7)})
              </div>
            `;
          } catch (err) {
            logDiv.innerHTML += `<div class="text-red-500 font-mono">修改失败 [${filePath}]: ${err.message}</div>`;
          }
        }
      } finally {
        // 关键修复：无论成功或失败，移除 spin 动画，标明处理完毕，彻底解决卡死假象
        titleDiv.className = 'font-medium text-claude-text flex items-center gap-1.5';
        titleDiv.innerHTML = `
          <svg class="w-4 h-4 text-claude-success flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          推送流程已全部完成
        `;
      }

      const vp = document.getElementById('chat-viewport');
      vp.scrollTop = vp.scrollHeight;
    }

    /* ================= 8. 消息 DOM 渲染（含弹窗编辑与思维链） ================= */

    function renderAssistantMessageDOM(data) {
      const stream = document.getElementById('chat-stream');
      const wrapper = document.createElement('div');
      wrapper.className = 'flex flex-col items-start space-y-1 w-full';

      if (data.isLoading) {
        wrapper.innerHTML = `
          <div class="w-full bg-claude-card border border-claude-border rounded-2xl p-3 text-xs text-claude-muted flex items-center gap-2 animate-pulse">
            <svg class="w-4 h-4 animate-spin text-claude-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span>${data.cleanText}</span>
          </div>
        `;
        stream.appendChild(wrapper);
        return wrapper;
      }

      // 思维链卡片（支持流式实时注入显示）
      const hasReasoning = Boolean(data.reasoning);
      const timeBadge = data.thinkingTime ? `<span class="text-[10px] text-claude-muted font-normal">思考耗时 ${data.thinkingTime} 秒</span>` : '已完成推理';
      const thinkingBlock = `
        <details class="mb-2.5 border border-claude-border bg-claude-sidebar rounded-xl text-xs overflow-hidden ${hasReasoning ? '' : 'hidden'}" open>
          <summary class="px-3 py-2 font-medium text-claude-text cursor-pointer flex items-center justify-between select-none">
            <div class="flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-claude-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
              <span class="text-[11px] font-semibold">思考过程 (Thinking Process)</span>
            </div>
            ${timeBadge}
          </summary>
          <div class="assistant-reasoning-text p-3 pt-1 text-[11px] text-claude-muted font-mono whitespace-pre-wrap border-t border-claude-border leading-relaxed">${escapeHtml(data.reasoning || '')}</div>
        </details>
      `;

      let patchesHtml = '';
      if (data.patches && data.patches.length > 0) {
        data.patches.forEach(p => {
          patchesHtml += `
            <div class="mt-2.5 border border-claude-border rounded-xl overflow-hidden bg-claude-bg">
              <div class="bg-claude-sidebar px-3 py-1.5 border-b border-claude-border flex justify-between items-center">
                <span class="text-[11px] font-mono text-claude-text font-medium">${p.path} (局部替换)</span>
              </div>
              <div class="p-2 space-y-1.5 text-[10px] font-mono">
                <div class="bg-red-50 text-red-600 p-1.5 rounded border border-red-100">
                  <div class="font-bold text-[9px] text-red-400 mb-0.5">- 原片段 (SEARCH):</div>
                  <pre>${escapeHtml(p.search)}</pre>
                </div>
                <div class="bg-green-50 text-green-700 p-1.5 rounded border border-green-100">
                  <div class="font-bold text-[9px] text-green-500 mb-0.5">+ 替换为 (REPLACE):</div>
                  <pre>${escapeHtml(p.replace)}</pre>
                </div>
              </div>
            </div>
          `;
        });
      }

      let tokenInfo = '';
      if (data.usage) {
        tokenInfo = `
          <div class="mt-2.5 pt-2 border-t border-claude-border/60 flex items-center justify-between text-[10px] text-claude-muted font-mono">
            <span>时间: ${data.timeStr}</span>
            <span>Tokens: ${data.usage.total_tokens} (提问:${data.usage.prompt_tokens} 回答:${data.usage.completion_tokens})</span>
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="w-full bg-claude-card border border-claude-border rounded-2xl p-3.5 text-xs select-text shadow-2xs">
          ${thinkingBlock}
          <div class="assistant-clean-text leading-relaxed whitespace-pre-wrap">${escapeHtml(data.cleanText || '')}</div>
          ${patchesHtml}
          ${tokenInfo}
        </div>
        <div class="flex items-center gap-2 pl-1">
          <button onclick="regenerateLastResponse()" class="text-[10px] text-claude-muted hover:text-claude-text active:opacity-60 flex items-center gap-0.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            重新生成
          </button>
        </div>
      `;

      stream.appendChild(wrapper);
      const vp = document.getElementById('chat-viewport');
      vp.scrollTop = vp.scrollHeight;
      return wrapper;
    }

    /* ================= 9. 独立弹窗编辑功能 ================= */
    function openEditMessageModal(index) {
      const msg = state.messages[index];
      if (!msg) return;
      document.getElementById('edit-target-index').value = index;
      document.getElementById('edit-message-textarea').value = msg.displayObj.text || '';
      openModal('edit-message-modal');
    }

    function confirmSaveEditedMessage() {
      const index = parseInt(document.getElementById('edit-target-index').value);
      const newText = document.getElementById('edit-message-textarea').value.trim();
      closeModal('edit-message-modal');
      
      document.getElementById('user-input').value = newText;
      sendMessage(false, index);
    }

    function regenerateLastResponse() {
      sendMessage(true);
    }

    /* ================= 10. 数据备份、导出与恢复 ================= */
    async function exportAllDataToJSON() {
      const allConvs = await storage.getAll('conversations');
      const backupData = {
        version: 3,
        exportTime: new Date().toISOString(),
        git: state.git,
        aiPresets: state.aiPresets,
        currentPresetId: state.currentPresetId,
        autoPush: state.autoPush,
        conversations: allConvs
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `ClaudeStudio_Backup_${getFormattedTime().replace(/:/g, '')}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      closeModal('backup-modal');
    }

    function importDataFromJSON(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (!imported.git) throw new Error('无效的备份数据');

          state.git = imported.git;
          if (imported.aiPresets) state.aiPresets = imported.aiPresets;
          if (imported.currentPresetId) state.currentPresetId = imported.currentPresetId;
          if (imported.autoPush !== undefined) state.autoPush = imported.autoPush;

          await storage.set('settings', { key: 'git_config', val: state.git });
          await storage.set('settings', { key: 'ai_presets', val: state.aiPresets });
          await storage.set('settings', { key: 'current_preset_id', val: state.currentPresetId });
          await storage.set('settings', { key: 'autopush_setting', val: state.autoPush });

          if (Array.isArray(imported.conversations)) {
            await storage.clear('conversations');
            for (const c of imported.conversations) {
              await storage.set('conversations', c);
            }
          }

          alert('数据恢复成功！正在重新加载...');
          location.reload();
        } catch (err) {
          alert('导入失败: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    /* ================= 11. 手工直接编辑与推送 ================= */
    function openDirectEditor() {
      const firstPath = Array.from(state.selectedPaths)[0] || '';
      document.getElementById('editor-filepath').value = firstPath;
      document.getElementById('editor-textarea').value = state.loadedFilesMap[firstPath]?.content || '';
      openModal('editor-modal');
    }

    async function directCommitAndPush() {
      const path = document.getElementById('editor-filepath').value.trim();
      const code = document.getElementById('editor-textarea').value;
      const msg = document.getElementById('editor-commit-msg').value.trim() || 'Direct edit from mobile';

      if (!path) return alert('请输入文件路径');
      if (!state.git.token || !state.git.repo) return alert('未绑定 Git 仓库');

      try {
        let sha = state.loadedFilesMap[path]?.sha || null;
        if (!sha) {
          const cRes = await fetch(`https://api.github.com/repos/${state.git.repo}/contents/${path}?ref=${state.git.branch}`, {
            headers: { 'Authorization': `Bearer ${state.git.token}` }
          });
          if (cRes.ok) sha = (await cRes.json()).sha;
        }

        const b64 = btoa(unescape(encodeURIComponent(code)));
        const bodyData = { message: msg, content: b64, branch: state.git.branch };
        if (sha) bodyData.sha = sha;

        const res = await fetch(`https://api.github.com/repos/${state.git.repo}/contents/${path}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${state.git.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });

        if (!res.ok) throw new Error('推送失败');
        const resJson = await res.json();
        state.loadedFilesMap[path] = { path, sha: resJson.content.sha, content: code };
        alert(`推送成功！Commit: ${resJson.commit.sha.substring(0, 7)}`);
        closeModal('editor-modal');
      } catch (err) {
        alert('推送出错: ' + err.message);
      }
    }

    /* ================= 12. 会话持久化与模型管理 ================= */
    async function createNewConversation() {
      const id = 'c_' + Date.now();
      const item = { id, title: '新聊天', updatedAt: Date.now(), messages: [] };
      await storage.set('conversations', item);
      state.currentConversationId = id;
      state.messages = [];
      document.getElementById('current-title').innerText = '新聊天';
      document.getElementById('chat-stream').innerHTML = '';
      toggleDrawer(false);
      renderHistoryList();
    }

    async function loadConversation(id) {
      const conv = await storage.get('conversations', id);
      if (!conv) return;
      state.currentConversationId = conv.id;
      state.messages = conv.messages || [];
      document.getElementById('current-title').innerText = conv.title || '新聊天';
      
      const stream = document.getElementById('chat-stream');
      stream.innerHTML = '';
      state.messages.forEach((m, idx) => {
        if (m.role === 'user') {
          renderUserMessageDOM(m.displayObj, m.time, idx);
        } else {
          renderAssistantMessageDOM({
            cleanText: m.cleanText || m.content,
            reasoning: m.reasoning,
            thinkingTime: m.thinkingTime,
            usage: m.usage,
            timeStr: m.time,
            patches: m.patches || [],
            isLoading: false,
            msgIndex: idx
          });
        }
      });
      toggleDrawer(false);
      renderHistoryList();
    }

    async function saveCurrentConversation() {
      if (!state.currentConversationId) return;
      let title = '新聊天';
      if (state.messages.length > 0) {
        const first = state.messages[0].displayObj?.text || state.messages[0].apiContent;
        title = typeof first === 'string' ? first.slice(0, 10) : '聊天与修改';
      }
      document.getElementById('current-title').innerText = title;
      await storage.set('conversations', {
        id: state.currentConversationId,
        title,
        updatedAt: Date.now(),
        messages: state.messages
      });
      renderHistoryList();
    }

    async function renderHistoryList() {
      const list = await storage.getAll('conversations');
      list.sort((a,b) => b.updatedAt - a.updatedAt);
      const c = document.getElementById('history-list');
      c.innerHTML = '';

      list.forEach(conv => {
        const el = document.createElement('div');
        const active = conv.id === state.currentConversationId;
        el.className = `p-2 rounded-lg border text-xs flex justify-between items-center ${active ? 'bg-claude-card border-claude-accent font-medium' : 'border-claude-border active:bg-claude-hover'}`;
        el.innerHTML = `
          <span class="truncate flex-1 pr-2" onclick="loadConversation('${conv.id}')">${conv.title}</span>
          <button onclick="storage.del('conversations', '${conv.id}').then(() => renderHistoryList())" class="text-claude-muted active:text-red-500">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        `;
        c.appendChild(el);
      });
    }

    async function loadCollaboratorRepos() {
      const token = document.getElementById('git-token-input').value.trim();
      if (!token) return alert('请先输入 Token');
      const select = document.getElementById('git-repo-dropdown');
      select.classList.remove('hidden');
      select.innerHTML = '<option value="">正在获取私密仓库...</option>';

      try {
        const res = await fetch('https://api.github.com/user/repos?affiliation=owner,collaborator,organization_member&sort=updated&per_page=60', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const repos = await res.json();
        select.innerHTML = '<option value="">-- 选择仓库 --</option>';
        repos.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.full_name;
          opt.innerText = `${r.private ? '[私有] ' : ''}${r.full_name}`;
          select.appendChild(opt);
        });
      } catch (e) {
        alert(e.message);
      }
    }

    function applyDropdownRepo() {
      const val = document.getElementById('git-repo-dropdown').value;
      if (val) document.getElementById('git-custom-repo').value = val;
    }

    async function saveGitSettings() {
      state.git.token = document.getElementById('git-token-input').value.trim();
      state.git.repo = document.getElementById('git-custom-repo').value.trim();
      state.git.branch = document.getElementById('git-branch').value.trim() || 'main';

      await storage.set('settings', { key: 'git_config', val: state.git });
      updateStatusHeader();
      closeModal('git-modal');
      fetchAllRepoFiles();
    }

    async function pullModelsFromApi() {
      const cur = getCurrentPreset();
      const baseUrl = document.getElementById('ai-base-input').value.trim().replace(/\/+$/, "");
      const key = document.getElementById('ai-key-input').value.trim();
      const msgEl = document.getElementById('model-pull-msg');
      if (!key) return alert('请输入 API Key');
      msgEl.innerText = '拉取中...';

      try {
        const res = await fetch(`${baseUrl}/models`, {
          headers: { 'Authorization': `Bearer ${key}` }
        });
        const data = await res.json();
        let list = [];
        if (Array.isArray(data.data)) list = data.data.map(m => m.id);
        else if (Array.isArray(data)) list = data.map(m => m.id || m.name);

        cur.availableModels = list;
        await storage.set('settings', { key: 'ai_presets', val: state.aiPresets });
        msgEl.innerText = `拉取成功！共 ${list.length} 个可用模型`;
        renderModelPickerList();
      } catch (err) {
        msgEl.innerText = '拉取失败: ' + err.message;
      }
    }

    function renderModelPickerList(filterKeyword = '') {
      const cur = getCurrentPreset();
      const c = document.getElementById('model-select-list');
      c.innerHTML = '';
      if (!cur.availableModels || cur.availableModels.length === 0) {
        c.innerHTML = '<p class="text-claude-muted text-center py-4">暂无模型，可从设置拉取或在上方手动添加</p>';
        return;
      }

      const filtered = cur.availableModels.filter(m => m.toLowerCase().includes(filterKeyword.toLowerCase()));
      if (filtered.length === 0) {
        c.innerHTML = '<p class="text-claude-muted text-center py-4">无匹配模型</p>';
        return;
      }

      filtered.forEach(m => {
        const el = document.createElement('div');
        el.className = 'p-2 rounded-lg border border-claude-border text-xs flex justify-between items-center active:bg-claude-hover cursor-pointer';
        el.innerHTML = `<span class="truncate font-mono">${m}</span> ${m === cur.model ? '<span class="text-claude-accent font-bold">✓</span>' : ''}`;
        el.onclick = async () => {
          cur.model = m;
          updateModelDisplay();
          await storage.set('settings', { key: 'ai_presets', val: state.aiPresets });
          closeModal('model-picker-modal');
        };
        c.appendChild(el);
      });
    }

    function filterModelList() {
      const val = document.getElementById('model-search-input').value.trim();
      renderModelPickerList(val);
    }

    async function saveManualModelToPreset() {
      const input = document.getElementById('manual-model-name');
      const val = input.value.trim();
      if (!val) return;
      const cur = getCurrentPreset();
      if (!cur.availableModels) cur.availableModels = [];
      if (!cur.availableModels.includes(val)) {
        cur.availableModels.unshift(val);
      }
      cur.model = val;
      input.value = '';
      updateModelDisplay();
      await storage.set('settings', { key: 'ai_presets', val: state.aiPresets });
      renderModelPickerList();
    }

    function handleImageSelected(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = (event) => {
        state.selectedImageBase64 = event.target.result;
        document.getElementById('preview-img').src = state.selectedImageBase64;
        document.getElementById('image-preview').classList.remove('hidden');
        document.getElementById('attachment-container').classList.remove('hidden');
      };
      r.readAsDataURL(f);
    }
    function clearSelectedImage() {
      state.selectedImageBase64 = null;
      document.getElementById('image-preview').classList.add('hidden');
      checkAttachmentBox();
    }
    function checkAttachmentBox() {
      if (!state.selectedImageBase64 && state.selectedPaths.size === 0) {
        document.getElementById('attachment-container').classList.add('hidden');
      }
    }
    function toggleDrawer(open) {
      const d = document.getElementById('drawer');
      const b = document.getElementById('drawer-backdrop');
      if (open) { d.classList.remove('-translate-x-full'); b.classList.remove('hidden'); }
      else { d.classList.add('-translate-x-full'); b.classList.add('hidden'); }
    }
    function switchDrawerTab(tab) {
      const cB = document.getElementById('tab-conv');
      const gB = document.getElementById('tab-git');
      const cP = document.getElementById('panel-conversations');
      const gP = document.getElementById('panel-git');
      if (tab === 'conversations') {
        cB.className = 'flex-1 py-3 text-xs font-semibold text-claude-accent border-b-2 border-claude-accent';
        gB.className = 'flex-1 py-3 text-xs font-semibold text-claude-muted';
        cP.classList.remove('hidden'); gP.classList.add('hidden');
      } else {
        gB.className = 'flex-1 py-3 text-xs font-semibold text-claude-accent border-b-2 border-claude-accent';
        cB.className = 'flex-1 py-3 text-xs font-semibold text-claude-muted';
        gP.classList.remove('hidden'); cP.classList.add('hidden');
      }
    }
    function openModal(id) { 
      document.getElementById(id).classList.remove('hidden'); 
      if (id === 'model-picker-modal') renderModelPickerList();
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function getFormattedTime() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
